name: notevault
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notevault
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: notevault
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - notevault_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notevault -d notevault"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  notevault_data:
